model_name: open-reason-xl
hub_model_id: theworker02/open-reason-xl
base_model: gpt2-scratch
base_license: Apache-2.0
dataset: theworker02/open-reason
local_data: data/release/all.jsonl
max_seq_len: 256
n_layer: 22
n_embd: 1280
n_head: 20
vocab_size: 8192
steps: 120
batch_size: 1
gradient_accumulation: 2
gradient_checkpointing: true
save_every: 5
learning_rate: 3.0e-4
device: cpu
docker_image: open-reason-train:cpu
notes: >
  XL GPT-2-style causal LM (~450M; 22 layers, hidden 1280, 20 heads, vocab 8192).
  Trained from scratch on Open Reason JSONL. Host CPU. Gradient checkpointing
  and batch 1 for memory. Not a 1B model. Keep small/medium/large as smaller
  checkpoints.
