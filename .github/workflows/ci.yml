name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Reddit grep
        run: python scripts/check_no_reddit.py
      - name: Validate mathematics build
        run: open-reason build --config mathematics --seed 42 --out data/work/ci
