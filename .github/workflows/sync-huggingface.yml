# Sync the Hugging Face dataset card directory on GitHub Releases only.
# Do not run this on every push to main. Do not sync the whole git tree.
#
# Hugging Face Trusted Publisher claims (Settings → Trusted Publishers):
#   Provider:    GitHub Actions
#   repository:  theworker02/open-reason
#   workflow:    sync-huggingface.yml    # filename, not the YAML name: below
#   branch:      leave blank             # this job runs on tags/releases, not a branch
# Do not change this filename or the `name:` key without updating docs/huggingface.md.
name: Sync Open Reason to Hugging Face

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face CLI
        run: python -m pip install "huggingface_hub[cli]"
      - name: Upload dataset-card directory
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN repository secret is required for upload."
            exit 1
          fi
          if [ ! -d distribution/dataset ]; then
            echo "::error::distribution/dataset directory not found."
            exit 1
          fi
          hf upload theworker02/open-reason distribution/dataset . --repo-type dataset
