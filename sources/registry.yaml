# Open Reason source registry
# Discovery is not ingestion. Auto-approve enables original curriculum tasks only.
# Open Reason does not use Reddit as a data source.
# Verbatim third-party copying still requires an explicit license review.

policy:
  reddit: prohibited
  quora_as_authority: prohibited
  auto_ingest_discovered: false
  community_votes_are_not_verification: true
  high_risk_requires_authoritative_or_execution: true
  auto_approve_curriculum: true
trust_tiers:
  0:
    id: tier0_verification
    name: Ground truth / direct verification
    examples:
    - executable_behavior
    - symbolic_or_numeric_computation
    - controlled_experiment
  1:
    id: tier1_authoritative
    name: Primary authoritative sources
    examples:
    - official_language_documentation
    - standards_and_specifications
    - government_scientific_agencies
  2:
    id: tier2_educational
    name: Structured educational sources
    examples:
    - khan_academy
    - mit_ocw
    - harvard_cs50
    - openstax
  3:
    id: tier3_scientific
    name: Open scientific knowledge
    examples:
    - openalex_metadata
    - open_access_literature_when_licensed
  4:
    id: tier4_community
    name: Community-validated knowledge
    examples:
    - stack_exchange
    note: Evidence layer only. Never sets quality.verified by itself.
  5:
    id: tier5_implementation
    name: Open-source implementation evidence
  6:
    id: tier6_human_authored
    name: Original Open Reason contributions
  7:
    id: tier7_synthetic
    name: Synthetic data that passed validation
