# Open Reason knowledge graph — original curriculum structure.
# Inspired by typical programming/math/science progressions, not copied from any course.

concepts:
  - id: python.variables
    name: Python variables
    domain: programming
    education_level: high_school
    prerequisites: []
    related_concepts: [python.expressions]
    common_mistakes: [python.variables.box_model]
    verification_methods: [trace_assignment]
    keywords: [variable, assignment, name binding]

  - id: python.expressions
    name: Python expressions
    domain: programming
    education_level: high_school
    prerequisites: [python.variables]
    related_concepts: [python.conditionals]
    common_mistakes: []
    verification_methods: [evaluate_expression]
    keywords: [expression, operator, precedence]

  - id: python.conditionals
    name: Python conditionals
    domain: programming
    education_level: high_school
    prerequisites: [python.expressions]
    related_concepts: [python.loops]
    common_mistakes: [python.conditionals.assignment_as_test]
